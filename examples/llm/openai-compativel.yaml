# Provedor `openai_compatible` (DD-01 §C.7): vLLM, LM Studio ou qualquer servidor que exponha
# `POST /v1/chat/completions`. Host local: `http://` é aceito sem `allow_insecure_http`.
#
#   uv run dataipsum gen examples/llm/openai-compativel.yaml -o /tmp/saida-vllm
version: 1
name: openai_compativel
seed: 42
llm:
  default_provider: local_vllm
  providers:
    local_vllm:
      kind: openai_compatible
      base_url: http://localhost:8000
      model: meu-modelo-local
      max_concurrency: 4
      timeout_s: 90
      temperature: 0

tables:
  - name: produtos
    rows: 20
    primary_key: {columns: [id], strategy: sequence, start: 1}
    columns:
      - {name: id, type: int}
      - {name: titulo, type: string, max_length: 80}
      - name: descricao
        type: llm_post
        max_length: 400
        params:
          provider: local_vllm
          mode: unique
          toxicity: block
