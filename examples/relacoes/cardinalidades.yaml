# As 4 formas de cardinalidade (DD-01 §B.3.4) lado a lado. No schema
# (camada YAML/pydantic), `fixed` é `range` com `min == max`, e `uniform` é
# açúcar de legibilidade para `range [mean-spread, mean+spread]` — os dois
# produzem exatamente o mesmo resultado que um `range` equivalente
# (`dataipsum.relations.cardinality.sample`, testado em
# `tests/relations/unit/test_cardinality.py::test_uniform_e_equivalente_a_range`).
#
#   uv run python -c "
#   from dataipsum import load_schema
#   from dataipsum.relations import RelationsPlanner
#   schema = load_schema('examples/relacoes/cardinalidades.yaml')
#   plan = RelationsPlanner().plan(schema, seed=schema.seed, chunk_size=schema.chunk_size)
#   for nome in ('filhos_fixed', 'filhos_range', 'filhos_uniform', 'filhos_zipf'):
#       print(nome, plan.tables[nome].rows)
#   "
version: 1
name: cardinalidades
seed: 4
chunk_size: 1000
tables:
  - name: pais
    rows: 100
    primary_key: {columns: [id], strategy: sequence, start: 1}
    columns:
      - {name: id, type: int}

  # fixed: exatamente 3 filhos por pai (range com min == max).
  - name: filhos_fixed
    rows_from:
      via: pai_id
      relation: one_to_many
      cardinality: {range: {min: 3, max: 3}}
    primary_key: {columns: [id], strategy: seeded_int, start: 1}
    columns:
      - {name: id, type: int}
      - {name: pai_id, type: ref, params: {table: pais}, null_ratio: 0.0}

  # range: uniforme inteiro em [1, 5].
  - name: filhos_range
    rows_from:
      via: pai_id
      relation: one_to_many
      cardinality: {range: {min: 1, max: 5}}
    primary_key: {columns: [id], strategy: seeded_int, start: 1}
    columns:
      - {name: id, type: int}
      - {name: pai_id, type: ref, params: {table: pais}, null_ratio: 0.0}

  # uniform (mean=5, spread=2): equivalente a range [3, 7].
  - name: filhos_uniform
    rows_from:
      via: pai_id
      relation: one_to_many
      cardinality: {range: {min: 3, max: 7}}
    primary_key: {columns: [id], strategy: seeded_int, start: 1}
    columns:
      - {name: id, type: int}
      - {name: pai_id, type: ref, params: {table: pais}, null_ratio: 0.0}

  # zipf: cauda longa em [0, 20], s=2.0 (a maioria dos pais tem poucos filhos).
  - name: filhos_zipf
    rows_from:
      via: pai_id
      relation: one_to_many
      cardinality: {range: {min: 0, max: 20}, distribution: {zipf: {s: 2.0}}}
    primary_key: {columns: [id], strategy: seeded_int, start: 1}
    columns:
      - {name: id, type: int}
      - {name: pai_id, type: ref, params: {table: pais}, null_ratio: 0.0}
