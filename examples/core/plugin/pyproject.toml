[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataipsum-plugin-exemplo"
version = "0.1.0"
description = "Plugin mínimo de exemplo para o dataIpsum: gerador `exemplo_placa` (DD-00 §7.2)."
requires-python = ">=3.12"
dependencies = []

# Grupo de entry points lido por dataipsum.registry.load_plugins (DD-00 §3.4).
# O nome do gerador ("exemplo_placa") é a CHAVE aqui; o valor aponta para a
# classe que implementa o Protocol `dataipsum.contracts.generator.Generator`.
[project.entry-points."dataipsum.generators"]
exemplo_placa = "dataipsum_plugin_exemplo:ExemploPlacaGenerator"

[tool.hatch.build.targets.wheel]
packages = ["src/dataipsum_plugin_exemplo"]
