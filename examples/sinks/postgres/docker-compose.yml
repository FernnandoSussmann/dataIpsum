# Compose mínimo só para o exemplo do sink postgres (DD-02, trilha E, E.7).
# Não confundir com o docker-compose.yml de dev da raiz (trilha G, DD-02): este é
# um ambiente descartável, só com Postgres, para testar o sink localmente.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dataipsum
      POSTGRES_PASSWORD: dataipsum
      POSTGRES_DB: dataipsum
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataipsum"]
      interval: 5s
      timeout: 3s
      retries: 10
