# Schema de referência da trilha H (DD-02 H.3.4): o exemplo completo do
# formato descrito em DD-00 §3.3, com três tabelas, uma relação `rows_from`
# (pedidos depende de usuarios via `usuario_id`), uma coluna `llm_*` com a
# seção `llm` correspondente e colunas exercitando `null_ratio`,
# `invalid_ratio`, `format` e `max_length`.
#
# É usado por `tests/contract/test_examples.py` (valida com `dataipsum.validate`
# e com o JSON Schema publicado) e é a referência que outras trilhas passam a
# usar a partir da integração do S5 (DD-02 §0, critério F-01).
#
# Neste marco (M4, só contrato), os tipos de coluna só precisam satisfazer a
# validação estrutural (`Schema.model_validate`): os registries de geradores e
# de planejamento (trilhas A/B/C do DD-01) ainda não existem, então
# `validate_with_registry` não roda validação de camada 4 sobre este arquivo.
version: 1
name: loja
seed: 42
locale: pt_BR
chunk_size: 10000
limits:
  max_rows_total: 100000000

llm:
  default_provider: local
  providers:
    local:
      kind: ollama
      base_url: http://ollama:11434
      model: llama3.1:8b
      max_concurrency: 2
      timeout_s: 120
      temperature: 0
  retry: {max_attempts: 5, base_delay_s: 1, max_delay_s: 60}

tables:
  - name: usuarios
    rows: 1000
    primary_key: {columns: [id], strategy: sequence, start: 1}
    columns:
      - {name: id, type: int}
      - {name: nome, type: nome_proprio, max_length: 120}
      - {name: cpf, type: cpf, format: masked, invalid_ratio: 0.02}
      - {name: bio, type: string, max_length: 200, null_ratio: 0.1}
      - name: criado_em
        type: timestamp
        params: {min: "2024-01-01T00:00:00Z", max: "2025-12-31T23:59:59Z"}

  - name: produtos
    rows: 200
    primary_key: {columns: [id], strategy: seeded_uuid}
    columns:
      - {name: id, type: uuid}
      - {name: titulo, type: string, max_length: 80}
      - name: preco
        type: decimal
        params: {precision: 10, scale: 2, min: "1.00", max: "5000.00"}

  - name: pedidos
    primary_key: {columns: [id], strategy: sequence}
    rows_from:
      via: usuario_id
      relation: one_to_many
      cardinality: {range: {min: 0, max: 5}}
    columns:
      - {name: id, type: int}
      - {name: usuario_id, type: ref, params: {table: usuarios}}
      - name: produto_id
        type: ref
        params: {table: produtos, distribution: {zipf: {s: 1.1}}}
      - name: comentario
        type: llm_post
        max_length: 500
        params:
          provider: local
          prompt: "Escreva um comentário curto de {usuario_id.nome} sobre o produto {produto_id.titulo}."
          mode: pool
          pool_size: 50
          toxicity: ratio
          toxicity_ratio: 0.05
          on_failure: pending
