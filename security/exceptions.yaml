# Exceções de segurança (DD-00 §3.2.1).
#
# Cada entrada precisa ter:
#   id:            identificador do achado (CVE, regra do bandit/semgrep, etc.)
#   tool:          bandit | semgrep | pip-audit | dependency-check
#   justification: por que a exceção é segura/aceitável
#   owner:         responsável pela exceção
#   expires:       data de expiração, formato YYYY-MM-DD
#
# Exemplo:
#   exceptions:
#     - id: CVE-2024-00000
#       tool: pip-audit
#       justification: "Falso positivo: função vulnerável não é chamada pelo dataIpsum."
#       owner: "fernando"
#       expires: "2026-12-31"
exceptions:
  - id: B506
    tool: bandit
    justification: >
      Falso positivo: dataipsum.schema.loader._NoAliasSafeLoader subclassa
      yaml.SafeLoader (mesma resolução restrita de tags do YAML seguro) e só
      sobrescreve compose_node para rejeitar âncoras/aliases (§3.3, §6.1).
      Bandit reconhece apenas os nomes literais SafeLoader/CSafeLoader como
      seguros e não subclasses customizadas.
    owner: "dataipsum-core"
    expires: "2027-12-31"

  - id: B608
    tool: bandit
    justification: >
      Falso positivo nos sinks postgres/mysql (DD-02, trilha E, E.5.3):
      identificadores (schema/tabela/coluna) são sempre pré-validados pela regex
      de identificador do DD-00 (§6.2) e quotados por `_quote_ident`/
      `quote_identifier_backtick` antes de entrar na string SQL; valores nunca
      são concatenados, sempre vão por parâmetros (`%s`) ou `COPY`. Já resolvido
      pontualmente com `# nosec B608` em cada ocorrência
      (src/dataipsum/sinks/{postgres,mysql}_sink.py); esta entrada só documenta
      a justificativa central exigida pelo guardrail de exceções de segurança.
    owner: "dataipsum-core"
    expires: "2027-12-31"
