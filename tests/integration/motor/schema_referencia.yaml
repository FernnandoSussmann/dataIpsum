# Schema de referência da integração do motor (DD-01 §3, S5): exercita tipos (A), relações
# 1:N/N:N/thread (B) e uma coluna `llm_*` + o `texto` de thread (C), tudo sob `LocalExecutor`
# (D). `FakeSink`/`FakeLLM`/`FakeToxicity` (DD-00 §3.11) substituem sink/provedor reais em
# `tests/integration/motor/conftest.py` — este schema não depende do DD-02.
version: 1
name: motor_referencia
seed: 2026
chunk_size: 100
llm:
  default_provider: local
  providers:
    local:
      kind: ollama
      model: golden-model

tables:
  - name: usuarios
    rows: 24
    primary_key: {columns: [id], strategy: sequence, start: 1}
    columns:
      - {name: id, type: int}
      - {name: nome, type: nome_proprio, max_length: 120}
      - name: email
        type: email
        max_length: 254
        params: {name_column: nome, unique: true}
      # Colunas abaixo só para exercitar os tipos de A.4 que não apareceriam de
      # outra forma no schema de referência (I-01: "todos os tipos"); não têm
      # papel de negócio na integração.
      - {name: sigla_uf, type: char, params: {length: 2, charset: alpha}}
      - {name: pontuacao, type: float, params: {min: 0.0, max: 10.0, decimals: 2}}
      - {name: saldo, type: decimal, params: {precision: 10, scale: 2, min: "0.00", max: "9999.99"}}
      - {name: ativo, type: boolean, params: {true_ratio: 0.8}}
      - {name: nascimento, type: date, params: {min: "1970-01-01", max: "2005-12-31"}}
      - {name: horario_preferido, type: time, params: {min: "08:00:00", max: "20:00:00"}}
      - {name: criado_em, type: timestamp, params: {min: "2024-01-01T00:00:00Z", max: "2024-12-31T23:59:59Z"}}
      - {name: sessao_id, type: uuid}
      - name: preferencias
        type: json
        params:
          fields:
            tema: {type: string, max_length: 10}
            notificacoes: {type: boolean}
          max_depth: 1
      - name: interesses
        type: array
        params:
          items: {type: string, max_length: 8}
          min_items: 0
          max_items: 3
      - {name: cpf, type: cpf}
      - {name: rg, type: rg}
      - {name: cartao, type: cartao_credito}

  - name: produtos
    rows: 12
    primary_key: {columns: [id], strategy: sequence, start: 1}
    columns:
      - {name: id, type: int}
      - {name: titulo, type: string, max_length: 40, params: {charset: lorem}}
      - name: descricao
        type: llm_post
        max_length: 280
        params: {provider: local, mode: unique, toxicity: allow, on_failure: pending}

  - name: pedidos
    rows_from:
      via: usuario_id
      relation: one_to_many
      cardinality: {range: {min: 1, max: 4}}
    primary_key: {columns: [id], strategy: seeded_int, start: 1}
    columns:
      - {name: id, type: int}
      - {name: usuario_id, type: ref, params: {table: usuarios}}

  - name: pedido_produto
    rows_from:
      via: pedido_id
      relation: many_to_many
      pair: produto_id
      cardinality: {range: {min: 1, max: 3}}
    primary_key: {columns: [pedido_id, produto_id], strategy: composite}
    columns:
      - {name: pedido_id, type: ref, params: {table: pedidos}}
      - {name: produto_id, type: ref, params: {table: produtos}}

  - name: mensagens
    rows_from:
      via: pedido_id
      relation: thread
      cardinality: {range: {min: 2, max: 4}}
    thread:
      participants: {table: usuarios, count: 3, label_column: nome}
      start: {min: "2024-01-01T00:00:00", max: "2024-01-05T00:00:00"}
      gap_seconds: {min: 5, max: 600}
      llm: {provider: local, toxicity: allow, on_failure: pending, max_length: 280}
    primary_key: {columns: [id], strategy: seeded_int, start: 1}
    columns:
      - {name: id, type: int}
      - {name: pedido_id, type: ref, params: {table: pedidos}}
